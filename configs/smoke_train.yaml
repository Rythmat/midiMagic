# Tiny CPU-friendly config used by the test-suite (fixture dataset).
cache_dir: data/token_cache_smoke
max_train_files: 50
max_val_files: 10
max_bars_per_file: 16
window_bars: 4
max_len: 512
d_model: 64
n_layers: 2
n_heads: 4
d_ff: 128
bar_layers: 1
max_bars: 16
dropout: 0.0
batch_size: 4
lr: 0.001
warmup_steps: 5
max_steps: 12
eval_every: 6
eval_batches: 2
device: cpu
amp: false
prep_workers: 1
log_every: 4
out: checkpoints/composer_smoke.pt
