# Full-scale configuration (all usable train files). Expect many GPU-hours; not run in this repo.
data_dir: data/xmidi
xmidi_root: XMIDI_Dataset
cache_dir: data/token_cache
max_train_files: null           # null = every usable training file
max_val_files: 2000
max_bars_per_file: 128
window_bars: 16
max_len: 2048
d_model: 512
n_layers: 12
n_heads: 8
d_ff: 2048
bar_layers: 4
max_bars: 64
dropout: 0.1
batch_size: 32
lr: 0.0003
weight_decay: 0.05
warmup_steps: 2000
max_steps: 200000
eval_every: 2000
eval_batches: 100
grad_clip: 1.0
seed: 0
device: auto
amp: true
num_workers: 4
prep_workers: 20
log_every: 200
out: checkpoints/composer_full.pt
