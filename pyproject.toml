[project]
name = "midicomposer"
version = "0.1.0"
description = "Conditional symbolic-music composition with root-relative MIDI normalization (XMIDI)."
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "mido>=1.3", "pyyaml>=6.0", "torch>=2.2", "fastapi>=0.110",
                "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
midicomposer = "midicomposer.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["midicomposer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:starlette.*", "ignore:Using `httpx`:DeprecationWarning"]
